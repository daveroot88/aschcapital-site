<style>

<noscript>
  <div class="wrap" style="padding-top:24px">
    <h1>Asch Capital</h1>
    <p class="lede">The boutique RIA AUM index: <b>$7.48 trillion</b> across <b>10,213</b> SEC-registered
    investment advisers reporting between $100 million and $5 billion in regulatory assets under
    management, built entirely from public Form ADV Part 1 filings.</p>
    <p>Every AUM, account and employee figure is a value an adviser filed with the SEC under Item 5
    of Form ADV Part 1. The split between market appreciation and net client flows is derived from
    those filings and a blended benchmark built from FRED series SP500 and DGS10.</p>
    <h2>What the filings show</h2>
    <ul>
      <li>Universe: 10,213 advisers, $7.48 trillion in regulatory AUM, from the 2026-08 Form ADV full file.</li>
      <li>9 annual snapshots, 2018-08 to 2026-08, joined on Organization CRD number.</li>
      <li>Over the period the blended benchmark compounded 2.08x. The
          8,122 advisers in the band at the start grew
          1.76x counting the 3,181 that
          stopped filing as zero, and 2.90x counting only the
          4,941 still filing.</li>
      <li>The median adviser grew slower than the benchmark in every size band, while aggregate
          assets in every band roughly doubled. Growth is concentrated in a few hundred acquirers.</li>
    </ul>
    <h2>Sources</h2>
    <p><a href="https://www.sec.gov/foia/docs/invafoia.htm">SEC Form ADV Part 1 monthly full files</a>
    &middot; <a href="https://fred.stlouisfed.org/">FRED, Federal Reserve Bank of St. Louis</a></p>
    <p><b>This site requires JavaScript</b> for the interactive index, screener and per-adviser detail.
    Nothing here is investment advice, a recommendation, or a performance record.</p>
  </div>
</noscript>
<div class="wrap"><main id="app"><div class="loading">Fetching SEC Form ADV Part 1<div class="bar"><i></i></div></div></main></div>
<footer class="colophon" id="colophon"></footer>

<script>
"use strict";

/* ====================== 1. DATA LAYER ===================================
   index.json is produced by ingest/build_index.py from the SEC's own
   monthly Form ADV Part 1 full files. It carries raw filed values only.
   Every growth, flow and ratio on this site is derived below, in the
   browser, so the arithmetic can be checked against the filings.
   ======================================================================= */
let DATA=null, FIRMS=[], YEARS=[], BENCH=[], META=null, BYCRD=new Map();
const clean = s => String(s).replace(/&amp;/g,"&");

function derive(){
  META   = DATA.meta;
  YEARS  = META.periods.map(p=>p.slice(0,4));
  BENCH  = DATA.benchmark.periods.map(p=>p.blended);   // % per period, [0] is null
  const C = META.columns;
  FIRMS = DATA.firms.map(r=>{
    const f={crd:r[0],name:r[1],city:r[2],state:r[3],aum:r[4],accts:r[5],
             emp:r[6],advemp:r[7],clients:r[8],disc:r[9],daccts:r[10],acqs:r[11],pfPct:r[12]};
    // --- market vs flows, one linked year at a time ---
    f.mc=[null]; f.fc=[null]; f.mcTotal=0; f.fcTotal=0; f.linked=0;
    for(let t=1;t<f.aum.length;t++){
      const p=f.aum[t-1], c=f.aum[t], b=BENCH[t];
      if(p==null||c==null||b==null){ f.mc.push(null); f.fc.push(null); continue; }
      const mc=p*b/100, fc=c-p-mc;
      f.mc.push(+mc.toFixed(1)); f.fc.push(+fc.toFixed(1));
      f.mcTotal+=mc; f.fcTotal+=fc; f.linked++;
    }
    f.mcTotal=+f.mcTotal.toFixed(1); f.fcTotal=+f.fcTotal.toFixed(1);
    const idx=f.aum.map((v,i)=>v==null?-1:i).filter(i=>i>=0);
    f.first=idx[0]; f.last=idx[idx.length-1];
    f.now=f.aum[f.last]; f.base=f.aum[f.first];
    f.span=f.last-f.first;
    f.growth=+(f.now-f.base).toFixed(1);
    f.cagr = f.span>0 && f.base>0 ? +((Math.pow(f.now/f.base,1/f.span)-1)*100).toFixed(2) : null;
    const avg=(f.base+f.now)/2;
    f.orgCagr = f.linked>0 && avg>0 ? +(f.fcTotal/avg/f.linked*100).toFixed(2) : null;
    f.earned  = f.growth!==0 ? Math.round(f.fcTotal/f.growth*100) : null;
    f.acctNow = f.accts[f.last]; f.acctBase=f.accts[f.first];
    f.perAcct = f.acctNow ? +(f.now*1000/f.acctNow).toFixed(0) : null;
    f.perEmp  = f.emp ? +(f.now/f.emp).toFixed(1) : null;
    f.full    = f.linked === f.aum.length-1;      // present in every snapshot
    f.color   = COLORS[f.crd % COLORS.length];
    f.label   = clean(f.name);
    f.search  = (f.name+" "+f.city+" "+f.state+" "+f.crd).toLowerCase();
    return f;
  });
  FIRMS.sort((a,b)=>b.now-a.now);
  FIRMS.forEach((f,i)=>{f.rank=i+1; BYCRD.set(f.crd,f);});
  UNIVERSE = YEARS.map((y,t)=>+FIRMS.reduce((a,f)=>a+(f.aum[t]||0),0).toFixed(0));
  PRESENT  = YEARS.map((y,t)=>FIRMS.filter(f=>f.aum[t]!=null).length);
  TOTAL    = UNIVERSE[UNIVERSE.length-1];
  TOTMC    = +FIRMS.reduce((a,f)=>a+f.mcTotal,0).toFixed(0);
  TOTFC    = +FIRMS.reduce((a,f)=>a+f.fcTotal,0).toFixed(0);
  TOTACCT  = FIRMS.reduce((a,f)=>a+(f.acctNow||0),0);
  TOTEMP   = FIRMS.reduce((a,f)=>a+(f.emp||0),0);
  FULL     = FIRMS.filter(f=>f.full);
  const s=FULL.map(f=>f.now).sort((x,y)=>x-y);
  MEDIAN   = s.length%2 ? s[s.length>>1] : (s[(s.length>>1)-1]+s[s.length>>1])/2;
  const o=FULL.map(f=>f.orgCagr).filter(v=>v!=null).sort((x,y)=>x-y);
  MEDIAN_ORG = +(o.length%2 ? o[o.length>>1] : (o[(o.length>>1)-1]+o[o.length>>1])/2).toFixed(2);
  STATES = (()=>{ const m=new Map();
    FIRMS.forEach(f=>{ const k=f.state||"--";
      const e=m.get(k)||{state:k,n:0,aum:0,fc:0,mc:0,acct:0};
      e.n++; e.aum+=f.now; e.fc+=f.fcTotal; e.mc+=f.mcTotal; e.acct+=f.acctNow||0; m.set(k,e); });
    return [...m.values()].sort((a,b)=>b.aum-a.aum); })();
}
let UNIVERSE,PRESENT,TOTAL,TOTMC,TOTFC,TOTACCT,TOTEMP,MEDIAN,MEDIAN_ORG,FULL,STATES;

/* The equity weight is the single largest assumption on this site, so it is a
   variable rather than a constant. Everything below recomputes from the two raw
   FRED legs, which means a reader can move it and watch the answer move. */
function blendAt(w){
  return DATA.benchmark.periods.map(p =>
    (p.equity==null||p.bond==null) ? null : +(w*p.equity + (1-w)*p.bond).toFixed(3));
}
function statsAt(w, set){
  const B=blendAt(w), orgs=[]; let mc=0, fc=0, mult=1;
  for(let t=1;t<B.length;t++) if(B[t]!=null) mult*=1+B[t]/100;
  (set||FULL).forEach(f=>{
    let m=0,c=0,n=0,lastV=null,firstV=null;
    for(let t=1;t<f.aum.length;t++){
      const pv=f.aum[t-1], cv=f.aum[t];
      if(pv==null||cv==null||B[t]==null) continue;
      if(firstV==null) firstV=pv;
      const mk=pv*B[t]/100; m+=mk; c+=cv-pv-mk; n++; lastV=cv;
    }
    mc+=m; fc+=c;
    const avg=(firstV+lastV)/2;
    if(n&&avg>0) orgs.push(c/avg/n*100);
  });
  orgs.sort((a,b)=>a-b);
  const q=f=>orgs.length?+orgs[Math.floor((orgs.length-1)*f)].toFixed(2):0;
  return {w, mult, market:+mc.toFixed(0), flows:+fc.toFixed(0),
          med:q(.5), p25:q(.25), p75:q(.75),
          negPct:orgs.length?Math.round(orgs.filter(v=>v<0).length/orgs.length*100):0, n:orgs.length};
}
function neutralWeight(set){          // equity weight at which the median adviser is flat
  let lo=0, hi=1;
  for(let i=0;i<24;i++){ const mid=(lo+hi)/2;
    if(statsAt(mid,set).med>0) lo=mid; else hi=mid; }
  return (lo+hi)/2;
}
const COLORS=["#1D4ED8","#0F766E","#B45309","#7C3AED","#4D7C0F","#BE2A1D","#2F5D6B","#A16207",
              "#8B1E3F","#0E7490","#6B4F3A","#4A5D23","#0B6E4F","#5B5EA6","#C2730A","#111827"];
/* ============================ 3. CHART ENGINE ===========================
   No external library. Inline SVG, one hover layer, one tooltip.
   ======================================================================= */
const NS="http://www.w3.org/2000/svg";
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function fmtM(v){const s=v<0?"-":"";v=Math.abs(v);
  if(v>=1e6)  return s+"$"+(v/1e6).toFixed(v>=1e7?1:2)+"T";
  if(v>=1000) return s+"$"+(v/1000).toFixed(v>=10000?1:2)+"B";
  return s+"$"+Math.round(v)+"M";}
function fmtMs(v){const s=v<0?"-":"+";return s+fmtM(Math.abs(v)).replace("-","");}
const fmtPct = v => (v>0?"+":"")+v.toFixed(1)+"%";
const fmtN   = v => v.toLocaleString();

function mkBox(host){const b=document.createElement("div");b.className="chartbox";host.appendChild(b);return b;}
function mkTip(box){const t=document.createElement("div");t.className="tip";box.appendChild(t);return t;}
function place(tip,box,xFrac,yPx,ev){
  const bx=box.getBoundingClientRect();
  // When the box scrolls horizontally a fraction of its width is the wrong anchor,
  // so prefer the real pointer position and add the scroll offset back in.
  const x = ev ? (ev.clientX-bx.left+box.scrollLeft) : (xFrac*bx.width+box.scrollLeft);
  tip.style.left=Math.max(70,Math.min(bx.width+box.scrollLeft-70,x))+"px";
  tip.style.top=yPx+"px"; tip.style.opacity=1;}

/* ---- multi-line chart -------------------------------------------------- */
function lineChart(host,opts){
  const W=1000,H=opts.h||330,PL=62,PR=14,PT=14,PB=30;
  const labels=opts.labels, series=opts.series.map(s=>({...s,on:true}));
  const box=mkBox(host), svg=el("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"none"});
  box.appendChild(svg); const tip=mkTip(box);
  const legend=document.createElement("div"); legend.className="legend"; box.appendChild(legend);
  const X=i=>PL+i*(W-PL-PR)/(labels.length-1);
  let lo,hi,Y;
  function draw(){
    const vis=series.filter(s=>s.on), all=[].concat(...vis.map(s=>s.data));
    lo=Math.min(...all); hi=Math.max(...all);
    if(opts.fromZero) lo=0;
    const pad=(hi-lo)*.10||1; if(!opts.fromZero) lo-=pad; hi+=pad;
    Y=v=>PT+(hi-v)/(hi-lo)*(H-PT-PB);
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    for(let t=0;t<=5;t++){ const v=lo+(hi-lo)*t/5, y=Y(v);
      svg.appendChild(el("line",{x1:PL,x2:W-PR,y1:y,y2:y,class:"gl"}));
      const tx=el("text",{x:PL-8,y:y+3.5,"text-anchor":"end",class:"axis"});
      tx.textContent=(opts.yFmt||fmtM)(v); svg.appendChild(tx); }
    labels.forEach((l,i)=>{const tx=el("text",{x:X(i),y:H-9,"text-anchor":"middle",class:"axis"});
      tx.textContent=l; svg.appendChild(tx);});
    series.forEach(s=>{ if(!s.on)return;
      let d=""; s.data.forEach((v,i)=>{ d+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)+" "; });
      if(opts.area && series.filter(x=>x.on).length===1)
        svg.appendChild(el("path",{d:d+"L"+X(s.data.length-1)+" "+Y(lo)+" L"+X(0)+" "+Y(lo)+" Z",
          fill:s.color,opacity:".13",stroke:"none"}));
      svg.appendChild(el("path",{d,fill:"none",stroke:s.color,"stroke-width":s.w||2.1,
        "stroke-linejoin":"round","stroke-linecap":"round","stroke-dasharray":s.dash||"none"})); });
    const hov=el("g",{}); svg.appendChild(hov);
    const rect=el("rect",{x:PL,y:0,width:W-PL-PR,height:H,fill:"transparent"}); svg.appendChild(rect);
    rect.addEventListener("mouseleave",()=>{tip.style.opacity=0;while(hov.firstChild)hov.removeChild(hov.firstChild);});
    rect.addEventListener("mousemove",e=>{
      const r=svg.getBoundingClientRect(), px=(e.clientX-r.left)/r.width*W;
      let i=Math.round((px-PL)/((W-PL-PR)/(labels.length-1)));
      i=Math.max(0,Math.min(labels.length-1,i));
      while(hov.firstChild)hov.removeChild(hov.firstChild);
      hov.appendChild(el("line",{x1:X(i),x2:X(i),y1:PT,y2:H-PB,stroke:"#12191F","stroke-width":1,opacity:".35"}));
      let rows=`<b>${labels[i]}</b>`;
      series.filter(s=>s.on).slice(0,12).forEach(s=>{
        hov.appendChild(el("circle",{cx:X(i),cy:Y(s.data[i]),r:3.4,fill:s.color,stroke:"#FBFAF6","stroke-width":1.4}));
        rows+=`<div class="row"><span><i style="background:${s.color}"></i>${clean(s.name)}</span><span>${(opts.tFmt||opts.yFmt||fmtM)(s.data[i])}</span></div>`;});
      tip.innerHTML=rows; place(tip,box,X(i)/W,(PT+8)/H*box.getBoundingClientRect().height,e);
    });
  }
  series.forEach(s=>{ const b=document.createElement("button"); b.className="lg line"; b.type="button";
    b.innerHTML=`<i style="background:${s.color}"></i>${clean(s.name)}`;
    b.onclick=()=>{ s.on=!s.on; b.classList.toggle("off",!s.on);
      if(!series.some(x=>x.on)){s.on=true;b.classList.remove("off");} draw(); };
    legend.appendChild(b); });
  if(opts.noLegend) legend.remove();
  draw(); return box;
}

/* ---- stacked area ------------------------------------------------------ */
function stackedArea(host,opts){
  const W=1000,H=opts.h||360,PL=62,PR=14,PT=14,PB=30;
  const labels=opts.labels, S=opts.series;
  const box=mkBox(host), svg=el("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"none"});
  box.appendChild(svg); const tip=mkTip(box);
  const tops=labels.map((_,i)=>S.reduce((a,s)=>a+s.data[i],0));
  const hi=Math.max(...tops)*1.04;
  const X=i=>PL+i*(W-PL-PR)/(labels.length-1), Y=v=>PT+(1-v/hi)*(H-PT-PB);
  for(let t=0;t<=5;t++){ const v=hi*t/5, y=Y(v);
    svg.appendChild(el("line",{x1:PL,x2:W-PR,y1:y,y2:y,class:"gl"}));
    const tx=el("text",{x:PL-8,y:y+3.5,"text-anchor":"end",class:"axis"}); tx.textContent=fmtM(v); svg.appendChild(tx); }
  labels.forEach((l,i)=>{const tx=el("text",{x:X(i),y:H-9,"text-anchor":"middle",class:"axis"});tx.textContent=l;svg.appendChild(tx);});
  const base=labels.map(()=>0);
  S.forEach(s=>{
    let up="",down="";
    s.data.forEach((v,i)=>{ up+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(base[i]+v).toFixed(1)+" "; });
    for(let i=labels.length-1;i>=0;i--) down+="L"+X(i).toFixed(1)+" "+Y(base[i]).toFixed(1)+" ";
    svg.appendChild(el("path",{d:up+down+"Z",fill:s.color,opacity:".82",stroke:"#FBFAF6","stroke-width":.6}));
    s.data.forEach((v,i)=>base[i]+=v);
  });
  const hov=el("g",{}); svg.appendChild(hov);
  const rect=el("rect",{x:PL,y:0,width:W-PL-PR,height:H,fill:"transparent"}); svg.appendChild(rect);
  rect.addEventListener("mouseleave",()=>{tip.style.opacity=0;while(hov.firstChild)hov.removeChild(hov.firstChild);});
  rect.addEventListener("mousemove",e=>{
    const r=svg.getBoundingClientRect(), px=(e.clientX-r.left)/r.width*W;
    let i=Math.round((px-PL)/((W-PL-PR)/(labels.length-1))); i=Math.max(0,Math.min(labels.length-1,i));
    while(hov.firstChild)hov.removeChild(hov.firstChild);
    hov.appendChild(el("line",{x1:X(i),x2:X(i),y1:PT,y2:H-PB,stroke:"#12191F","stroke-width":1,opacity:".4"}));
    const rank=[...S].sort((a,b)=>b.data[i]-a.data[i]).slice(0,6);
    let rows=`<b>${labels[i]} &middot; total ${fmtM(tops[i])}</b>`;
    rank.forEach(s=>{rows+=`<div class="row"><span><i style="background:${s.color}"></i>${clean(s.name)}</span><span>${fmtM(s.data[i])}</span></div>`;});
    rows+=`<div class="row" style="opacity:.6"><span>+ ${S.length-6} smaller</span><span></span></div>`;
    tip.innerHTML=rows; place(tip,box,X(i)/W,(PT+8)/H*box.getBoundingClientRect().height,e);
  });
  return box;
}

/* ---- horizontal bar (single or paired) --------------------------------- */
function barChart(host,rows,opts){
  opts=opts||{};
  const W=1000,rowH=opts.rowH||26,PT=8,PB=20,PL=opts.pl||210,PR=64;
  const H=PT+rows.length*rowH+PB;
  const box=mkBox(host), svg=el("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"none"}); box.appendChild(svg);
  const max=Math.max(...rows.map(r=>Math.abs(r.value)))||1;
  rows.forEach((r,i)=>{
    const y=PT+i*rowH, w=Math.abs(r.value)/max*(W-PL-PR);
    svg.appendChild(el("rect",{x:PL,y:y+4,width:Math.max(w,1),height:rowH-11,fill:r.color||"#12191F",opacity:r.dim?".38":".9",rx:2}));
    const t=el("text",{x:PL-10,y:y+rowH/2+3.5,"text-anchor":"end",class:"axis rowlabel"});
    t.textContent=r.label; t.style.fill=r.dim?"#5C6560":"#12191F"; svg.appendChild(t);
    const v=el("text",{x:PL+w+8,y:y+rowH/2+3.5,class:"axis"}); v.textContent=(opts.fmt||(x=>x))(r.value); svg.appendChild(v);
    if(r.onClick){const hit=el("rect",{x:0,y:y,width:W,height:rowH,fill:"transparent",style:"cursor:pointer"});
      hit.addEventListener("click",r.onClick); svg.appendChild(hit);}
  });
  return box;
}

/* ---- stacked / diverging bar: market vs flows --------------------------- */
function splitBar(host,rows,opts){
  opts=opts||{};
  const W=1000,rowH=opts.rowH||27,PT=8,PB=26,PL=opts.pl||210,PR=96;
  const H=PT+rows.length*rowH+PB;
  const box=mkBox(host), svg=el("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"none"});
  box.appendChild(svg); const tip=mkTip(box);
  const negMax=Math.max(0,...rows.map(r=>Math.max(0,-r.a)+Math.max(0,-r.b)));
  const posMax=Math.max(1,...rows.map(r=>Math.max(0,r.a)+Math.max(0,r.b)));
  const span=negMax+posMax, plot=W-PL-PR, zero=PL+negMax/span*plot;
  const px=v=>v/span*plot;
  svg.appendChild(el("line",{x1:zero,x2:zero,y1:PT,y2:H-PB,class:"zero"}));
  rows.forEach((r,i)=>{
    const y=PT+i*rowH, h=rowH-11;
    let cursorP=zero, cursorN=zero;
    [[r.a,opts.aColor||"#A9B2AC",opts.aName||"Market"],[r.b,r.b<0?"#A8322A":(opts.bColor||"#1F6B4A"),opts.bName||"Net flows"]]
      .forEach(([v,c])=>{ if(!v)return; const w=px(Math.abs(v));
        if(v>0){svg.appendChild(el("rect",{x:cursorP,y:y+4,width:w,height:h,fill:c,rx:2}));cursorP+=w;}
        else{cursorN-=w;svg.appendChild(el("rect",{x:cursorN,y:y+4,width:w,height:h,fill:c,rx:2}));}});
    const t=el("text",{x:PL-10,y:y+rowH/2+3.5,"text-anchor":"end",class:"axis rowlabel"});
    t.textContent=r.label; t.style.fill="#12191F"; svg.appendChild(t);
    const tot=r.a+r.b;
    const v=el("text",{x:W-PR+8,y:y+rowH/2+3.5,class:"axis"}); v.textContent=fmtMs(tot); svg.appendChild(v);
    const hit=el("rect",{x:0,y:y,width:W,height:rowH,fill:"transparent",style:r.onClick?"cursor:pointer":""});
    if(r.onClick) hit.addEventListener("click",r.onClick);
    hit.addEventListener("mousemove",ev=>{
      tip.innerHTML=`<b>${r.label}</b>
        <div class="row"><span><i style="background:${opts.aColor||"#A9B2AC"}"></i>${opts.aName||"Market"}</span><span>${fmtMs(r.a)}</span></div>
        <div class="row"><span><i style="background:${r.b<0?"#A8322A":(opts.bColor||"#1F6B4A")}"></i>${opts.bName||"Net flows"}</span><span>${fmtMs(r.b)}</span></div>
        <div class="row"><span>Total change</span><span>${fmtMs(tot)}</span></div>`;
      place(tip,box,.5,(y+2)/H*box.getBoundingClientRect().height,ev);});
    hit.addEventListener("mouseleave",()=>tip.style.opacity=0);
    svg.appendChild(hit);
  });
  const zl=el("text",{x:zero,y:H-8,"text-anchor":"middle",class:"axis"}); zl.textContent="0"; svg.appendChild(zl);
  return box;
}

/* ---- scatter: size vs organic growth ----------------------------------- */
function scatter(host,pts,opts){
  const W=1000,H=opts.h||400,PL=62,PR=24,PT=18,PB=42;
  const box=mkBox(host), svg=el("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"none"});
  box.appendChild(svg); const tip=mkTip(box);
  const xs=pts.map(p=>Math.log10(p.x)), ys=pts.map(p=>p.y);
  const x0=Math.floor(Math.min(...xs)*4)/4-.06, x1=Math.ceil(Math.max(...xs)*4)/4+.06;
  const y0=Math.min(...ys)-2, y1=Math.max(...ys)+2;
  const X=v=>PL+(Math.log10(v)-x0)/(x1-x0)*(W-PL-PR), Y=v=>PT+(y1-v)/(y1-y0)*(H-PT-PB);
  const nearZero=(y1-y0)/9;
  for(let t=0;t<=5;t++){const v=y0+(y1-y0)*t/5,y=Y(v);
    svg.appendChild(el("line",{x1:PL,x2:W-PR,y1:y,y2:y,class:"gl"}));
    if(y0<0&&y1>0&&Math.abs(v)<nearZero) continue;
    const tx=el("text",{x:PL-8,y:y+3.5,"text-anchor":"end",class:"axis"});tx.textContent=v.toFixed(0)+"%";svg.appendChild(tx);}
  [100,200,500,1000,2000,5000].filter(v=>Math.log10(v)>=x0&&Math.log10(v)<=x1).forEach(v=>{
    svg.appendChild(el("line",{x1:X(v),x2:X(v),y1:PT,y2:H-PB,class:"gl"}));
    const tx=el("text",{x:X(v),y:H-24,"text-anchor":"middle",class:"axis"});tx.textContent=fmtM(v);svg.appendChild(tx);});
  if(y0<0&&y1>0){ svg.appendChild(el("line",{x1:PL,x2:W-PR,y1:Y(0),y2:Y(0),class:"zero"}));
    const z=el("text",{x:PL-8,y:Y(0)+3.5,"text-anchor":"end",class:"axis"});
    z.textContent="0%"; z.style.fill="#12191F"; svg.appendChild(z); }
  const rMax=Math.max(...pts.map(p=>p.r)), taken=[];
  pts.forEach(p=>{
    const rr=7+Math.sqrt(p.r/rMax)*17;
    const c=el("circle",{cx:X(p.x),cy:Y(p.y),r:rr,fill:p.color,opacity:".62",stroke:p.color,"stroke-width":1.4,style:"cursor:pointer"});
    c.addEventListener("mousemove",ev=>{ tip.innerHTML=`<b>${clean(p.name)}</b>
      <div class="row"><span>Regulatory AUM</span><span>${fmtM(p.x)}</span></div>
      <div class="row"><span>Organic growth</span><span>${fmtPct(p.y)}/yr</span></div>
      <div class="row"><span>Accounts</span><span>${fmtN(p.r)}</span></div>`;
      place(tip,box,X(p.x)/W,(Y(p.y)-rr-4)/H*box.getBoundingClientRect().height,ev);});
    c.addEventListener("mouseleave",()=>tip.style.opacity=0);
    if(p.onClick) c.addEventListener("click",p.onClick);
    svg.appendChild(c);
    if(p.tag){
      let ty=Y(p.y)-rr-5;
      while(taken.some(t=>Math.abs(t.x-X(p.x))<66 && Math.abs(t.y-ty)<11)) ty-=12;
      taken.push({x:X(p.x),y:ty});
      const t=el("text",{x:X(p.x),y:ty,"text-anchor":"middle",class:"axis rowlabel"});
      t.textContent=p.tag;t.style.fill="#12191F";svg.appendChild(t);}
  });
  const xl=el("text",{x:(PL+W-PR)/2,y:H-6,"text-anchor":"middle",class:"axis"});
  xl.textContent="REGULATORY AUM (LOG SCALE) &rarr;"; xl.textContent="REGULATORY AUM, LOG SCALE"; svg.appendChild(xl);
  return box;
}

/* ---- sparkline: AUM path, flow-negative years picked out in red -------- */
function sparkline(f){
  const W=240,H=36,lo=Math.min(...f.aum),hi=Math.max(...f.aum);
  const X=i=>i*W/(NY-1), Y=v=>H-3-(v-lo)/((hi-lo)||1)*(H-8);
  let d=""; f.aum.forEach((v,i)=>{d+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)+" ";});
  let neg=""; for(let i=1;i<NY;i++) if(f.fc[i]<0)
    neg+=`M${X(i-1).toFixed(1)} ${Y(f.aum[i-1]).toFixed(1)} L${X(i).toFixed(1)} ${Y(f.aum[i]).toFixed(1)} `;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${f.color}" stroke-width="1.9" stroke-linejoin="round"/>
    <path d="${neg}" fill="none" stroke="#A8322A" stroke-width="2.8" stroke-linecap="round"/></svg>`;
}

  app.appendChild(wrap);
  sec(`<p class="cap">These advisers are not in the index and never will be again. They are shown here because leaving them out of the aggregate silently is exactly the error this page exists to prevent. <span class="method">&#9888; READ THESE MULTIPLES WITH CARE. Both endpoints are filed values, but a 300x move is not a firm that grew 300 times. Form ADV registrations get restructured: an existing book of business moves onto a new or different legal entity, and the receiving CRD shows an enormous jump that never happened as growth. Roll-up acquirers show the same pattern for a different reason. Form ADV does not distinguish any of these from organic growth, and neither can this site.</span></p>

function sparkline(f){
  const W=240,H=36, pts=f.aum.map((v,i)=>[i,v]).filter(p=>p[1]!=null);
  const lo=Math.min(...pts.map(p=>p[1])), hi=Math.max(...pts.map(p=>p[1]));
  const X=i=>i*W/(YEARS.length-1), Y=v=>H-3-(v-lo)/((hi-lo)||1)*(H-8);
  let d=""; pts.forEach((p,i)=>{d+=(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)+" ";});
  let neg=""; for(let t=1;t<YEARS.length;t++) if(f.fc[t]!=null&&f.fc[t]<0&&f.aum[t-1]!=null)
    neg+=`M${X(t-1).toFixed(1)} ${Y(f.aum[t-1]).toFixed(1)} L${X(t).toFixed(1)} ${Y(f.aum[t]).toFixed(1)} `;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${f.color}" stroke-width="1.9" stroke-linejoin="round"/>
    <path d="${neg}" fill="none" stroke="#A8322A" stroke-width="2.8" stroke-linecap="round"/></svg>`;
}

const SCR={q:"",state:"",band:"",sort:"now",asc:false,page:0,per:50};
function renderScreener(){
  sec(`<p class="eyebrow q">SCREENER &middot; ALL ${fmtN(FIRMS.length)} ADVISERS</p>
  <h1>The whole universe.</h1>
  <p class="lede">Search by name, city or CRD. Click a column to sort, click a name to open the adviser's filing detail.</p>`);
  const tools=node(`<div class="tools">
    <input type="search" id="scrq" placeholder="Name, city or CRD" value="${SCR.q.replace(/"/g,"&quot;")}">
    <select id="scrstate"><option value="">All states</option>${
      STATES.filter(s=>s.state!=="--").map(s=>`<option value="${s.state}"${SCR.state===s.state?" selected":""}>${s.state} (${fmtN(s.n)})</option>`).join("")}</select>
    <select id="scrband"><option value="">All sizes</option>${
      COHORTS.map(c=>`<option value="${c.k}"${SCR.band===c.k?" selected":""}>${c.k}</option>`).join("")}</select>
    <span class="hits" id="scrhits"></span></div>`);
  app.appendChild(tools);

  const cols=[
    {k:"name",   t:"Adviser",        s:false},
    {k:"now",    t:"Regulatory AUM", f:fmtM},
    {k:"cagr",   t:"AUM CAGR",       f:v=>v==null?"&mdash;":fmtPct(v), sign:true},
    {k:"orgCagr",t:"Organic /yr",    f:v=>v==null?"&mdash;":fmtPct(v), sign:true},
    {k:"earned", t:"% earned",       f:v=>v==null?"&mdash;":v+"%",     sign:true},
    {k:"fcTotal",t:"Net flows",      f:fmtMs, sign:true},
    {k:"mcTotal",t:"Market",         f:fmtMs},
    {k:"acctNow",t:"Accounts",       f:v=>v?fmtN(v):"&mdash;"},
    {k:"perAcct",t:"$ / account",    f:v=>v?"$"+fmtN(v)+"k":"&mdash;"},
    {k:"emp",    t:"Staff",          f:v=>v||"&mdash;"},
    {k:"perEmp", t:"AUM / head",     f:v=>v?fmtM(v):"&mdash;"},
    {k:"disc",   t:"Discretionary",  f:v=>v+"%"},
    {k:"span",   t:"Filings linked", f:v=>v+1+" of "+YEARS.length}];
  const wrap=node(`<div class="tblwrap"><table><thead><tr></tr></thead><tbody></tbody></table></div>`);
  const tr=wrap.querySelector("thead tr"), tb=wrap.querySelector("tbody");
  cols.forEach(c=>{const th=document.createElement("th"); th.textContent=c.t;
    if(c.s!==false) th.style.textAlign="right";
    th.onclick=()=>{ if(SCR.sort===c.k) SCR.asc=!SCR.asc; else {SCR.sort=c.k; SCR.asc=(c.k==="name");}
      SCR.page=0; paint(); };
    tr.appendChild(th);});
  app.appendChild(wrap);
  const pagi=node(`<div class="pagi">
    <button id="pfirst">&laquo; first</button><button id="pprev">&lsaquo; prev</button>
    <span id="pinfo"></span><button id="pnext">next &rsaquo;</button><button id="plast">last &raquo;</button></div>`);
  app.appendChild(pagi);

  function filtered(){
    const q=SCR.q.trim().toLowerCase();
    const band=COHORTS.find(c=>c.k===SCR.band);
    return FIRMS.filter(f=>
      (!q || f.search.includes(q)) &&
      (!SCR.state || f.state===SCR.state) &&
      (!band || (f.now>=band.lo && f.now<band.hi)));
  }
  function paint(){
    [...tr.children].forEach((th,i)=>{th.classList.toggle("sorted",cols[i].k===SCR.sort);th.classList.toggle("asc",SCR.asc);});
    const list=filtered().sort((a,b)=>{
      if(SCR.sort==="name") return a.label.localeCompare(b.label)*(SCR.asc?1:-1);
      const x=a[SCR.sort], y=b[SCR.sort];
      if(x==null) return 1; if(y==null) return -1;
      return (x-y)*(SCR.asc?1:-1);});
    const pages=Math.max(1,Math.ceil(list.length/SCR.per));
    SCR.page=Math.min(SCR.page,pages-1);
    const slice=list.slice(SCR.page*SCR.per,(SCR.page+1)*SCR.per);
    tb.innerHTML="";
    slice.forEach(f=>{const r=document.createElement("tr");
      cols.forEach(c=>{const td=document.createElement("td");
        if(c.k==="name"){td.className="nm";
          td.innerHTML=`${f.name} <span style="color:#5C6560;font-weight:400;font-size:12px">${f.city||""}${f.state?", "+f.state:""}</span>`;
          td.onclick=()=>go("firm/"+f.crd);}
        else {td.className="num"; td.innerHTML=c.f(f[c.k]);
          if(c.sign&&f[c.k]!=null) td.classList.add(f[c.k]>=0?"pos":"neg");}
        r.appendChild(td);});
      tb.appendChild(r);});
    document.getElementById("scrhits").innerHTML=`${fmtN(list.length)} of ${fmtN(FIRMS.length)} &middot; ${fmtM(list.reduce((a,f)=>a+f.now,0))}`;
    document.getElementById("pinfo").textContent=`page ${SCR.page+1} of ${fmtN(pages)}`;
    pagi.querySelector("#pfirst").disabled=pagi.querySelector("#pprev").disabled=SCR.page===0;
    pagi.querySelector("#pnext").disabled=pagi.querySelector("#plast").disabled=SCR.page>=pages-1;
    pagi._pages=pages;
  }
  const go_=n=>{SCR.page=n; paint(); wrap.scrollIntoView({block:"start",behavior:"instant"});};
  pagi.querySelector("#pfirst").onclick=()=>go_(0);
  pagi.querySelector("#pprev").onclick =()=>go_(SCR.page-1);
  pagi.querySelector("#pnext").onclick =()=>go_(SCR.page+1);
  pagi.querySelector("#plast").onclick =()=>go_(pagi._pages-1);
  let deb;
  tools.querySelector("#scrq").oninput=e=>{clearTimeout(deb);
    deb=setTimeout(()=>{SCR.q=e.target.value; SCR.page=0; paint();},140);};
  tools.querySelector("#scrstate").onchange=e=>{SCR.state=e.target.value; SCR.page=0; paint();};
  tools.querySelector("#scrband").onchange =e=>{SCR.band =e.target.value; SCR.page=0; paint();};
  paint();
  sec(`<p class="cap">"Filings linked" is how many of the ${YEARS.length} annual snapshots this adviser appears in above $100M. An adviser present in fewer has a shorter derived history and its organic rate is computed over that shorter window. <span class="method">&#10003; AUM, accounts, staff, discretionary share FILED. &#9673; Everything else DERIVED.</span></p>`);
  pager(5);
}

  <p>FRED's ICE and BofA total-return bond indices are licence-limited to a rolling three-year window, which is too short for this series. The equity leg therefore uses the S&P 500 price index with a constant dividend add-back, and the bond leg is a duration approximation from the 10-year Treasury. Both are stated below rather than hidden, and both are configurable at build time.</p>

equity[t] = SP500[t] / SP500[t-1] - 1 + ${b.dividend_addback_pct}%      (FRED: SP500)

  sec(`<h2>What would make this better</h2>
  <p>Three additions, in order of value. First, <b>monthly rather than annual snapshots</b>. The SEC publishes ${fmtN(224)} of these files back to 2006 and this build reads ${META.periods.length} of them. Reading all of them raises the resolution of the flows calculation roughly twelvefold and costs only time. Second, <b>Form 13F cross-reference</b>, which would give a real market-exposed share for the minority of advisers who file one and replace the uniform benchmark assumption for them. Third, <b>an adviser correction channel</b>, because the fastest way to learn that a jump was an acquisition is for the adviser to say so.</p>

function pager(i){
  const p=document.createElement("div"); p.className="pager";
  const prev=SCREENS[i-1], next=SCREENS[i+1];
  const a=document.createElement("button"); a.className="pg";
  a.textContent=prev?"← "+prev.label:"←"; a.disabled=!prev; if(prev)a.onclick=()=>go(prev.id);
  const b=document.createElement("button"); b.className="pg";
  b.textContent=next?next.label+" →":"→"; b.disabled=!next; if(next)b.onclick=()=>go(next.id);
  p.append(a,b); app.appendChild(p);
}

const strip=document.getElementById("strip"), stripwrap=document.getElementById("stripwrap");
function buildStrip(){
  strip.innerHTML="";
  SCREENS.forEach(s=>{const c=document.createElement("button"); c.className="chip"+(s.cls?" "+s.cls:"");
    c.textContent=s.label; c.dataset.id=s.id; c.onclick=()=>go(s.id); strip.appendChild(c);});
}
stripwrap.querySelector(".cscroll.l").onclick=()=>strip.scrollBy({left:-260});
stripwrap.querySelector(".cscroll.r").onclick=()=>strip.scrollBy({left:260});
function overflowCheck(){stripwrap.classList.toggle("over",strip.scrollWidth>strip.clientWidth+4);}
addEventListener("resize",overflowCheck);

/* ---- nav search with keyboard-navigable results ---- */
const qbox=document.getElementById("q"); let acEl=null, acSel=-1, acList=[];
function closeAc(){ if(acEl){acEl.remove(); acEl=null;} acSel=-1; acList=[]; }
function openAc(){
  const q=qbox.value.trim().toLowerCase(); closeAc();
  if(q.length<2||!FIRMS.length) return;
  acList=FIRMS.filter(f=>f.search.includes(q)).slice(0,8);
  if(!acList.length) return;
  acEl=document.createElement("div"); acEl.className="ac";
  acList.forEach((f,i)=>{const b=document.createElement("button"); b.type="button";
    b.innerHTML=`${f.name}<br><span class="sub">${fmtM(f.now)} &middot; ${f.city||""}${f.state?", "+f.state:""} &middot; CRD ${f.crd}</span>`;
    b.onmousedown=e=>{e.preventDefault(); qbox.value=""; closeAc(); go("firm/"+f.crd);};
    acEl.appendChild(b);});
  qbox.parentNode.appendChild(acEl);
}
let qdeb; qbox.oninput=()=>{clearTimeout(qdeb); qdeb=setTimeout(openAc,120);};
qbox.onblur=()=>setTimeout(closeAc,140);
qbox.onfocus=()=>{ if(qbox.value.trim().length>=2) openAc(); };
qbox.onkeydown=e=>{
  if(e.key==="Escape"){ closeAc(); qbox.blur(); return; }
  if(!acList.length){ if(e.key==="Enter"){ SCR.q=qbox.value; SCR.page=0; go("screener"); } return; }
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault(); acSel=(acSel+(e.key==="ArrowDown"?1:-1)+acList.length)%acList.length;
    [...acEl.children].forEach((c,i)=>c.classList.toggle("sel",i===acSel));
  } else if(e.key==="Enter"){
    e.preventDefault();
    if(acSel>=0){ qbox.value=""; const f=acList[acSel]; closeAc(); go("firm/"+f.crd); }
    else { SCR.q=qbox.value; SCR.page=0; closeAc(); go("screener"); }
  }
};

let CURRENT="index";
function go(id){ CURRENT=id; try{ if(location.hash.slice(2)!==id) location.hash="#/"+id; }catch(e){} route(id); }
document.getElementById("home").onclick=()=>go("index");

function route(force){
  let id=force; if(!id){ try{ id=location.hash.slice(2); }catch(e){} }
  id=id||CURRENT||"index";
  /* Screens registered by app/labs.js score and render on their own and
     never read DATA, so they must not sit behind the 1.7 MB index fetch. */
  const labs=!!(window.LABS&&LABS.has(id));
  if(!DATA&&!labs) return;
  CURRENT=id;
  app.innerHTML="";
  if(labs)                        LABS.route(id);
  else if(id==="index")           renderHome();
  else if(id==="method")          renderMethod();
  else if(id==="ceiling")         renderCeiling();
  else if(id==="cohorts")         renderCohorts();
  else if(id==="states")          renderStates();
  else if(id==="screener")        renderScreener();
  else if(id==="disclosures")     renderDisc();
  else if(id.startsWith("firm/")) renderFirm(id.slice(5));
  else { go("index"); return; }
  if(labs) app.dataset.labs=id; else delete app.dataset.labs;
  /* Each new section carries its own visual identity; leaving one takes
     it back off, so the index screens are never skinned. */
  if(window.LABS) LABS.applySkin(labs?id:null);
  const chipId=labs?LABS.chipFor(id):id;
  [...strip.children].forEach(c=>{const on=c.dataset.id===chipId; c.classList.toggle("on",on);
    if(on) c.scrollIntoView({block:"nearest",inline:"center"});});
  scrollTo({top:0,behavior:"instant"});
  const s=SCREENS.find(s=>s.id===id);
  const f=(!labs&&id.startsWith("firm/"))?BYCRD.get(+id.slice(5)):null;
  document.title = id==="index" ? "Asch Capital"
                 : "Asch Capital · " + (f?f.label:(labs?LABS.titleFor(id):(s?s.label:"Not found")));
  overflowCheck();
}
addEventListener("hashchange",()=>{const id=location.hash.slice(2)||"index"; if(id!==CURRENT) route(id);});

/* ---- boot ---- */
function colophon(){
  document.getElementById("colophon").innerHTML=`
  <b>ASCH CAPITAL</b> &middot; The Boutique RIA AUM Index &middot; ${fmtN(FIRMS.length)} advisers &middot; ${fmtM(TOTAL)}<br>
  &ldquo;Every dollar of AUM growth was either won or borrowed. Only one of them is a business.&rdquo;<br>

  Filings as of ${filedOn()} &middot; index built ${META.generated.slice(0,10)} &middot; every adviser page links to its live SEC record<br>

  document.getElementById("tag").innerHTML=

fetch("index.json",{cache:"no-cache"})
  .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(j=>{ DATA=j; derive(); buildStrip(); colophon(); overflowCheck();
    /* A labs screen may already be rendered (it does not wait for this
       fetch). Re-running route() there would throw away in-progress
       state, so only the chip strip is refreshed. */
    if(window.LABS&&LABS.has(CURRENT)&&app.dataset.labs===CURRENT){
      const c=LABS.chipFor(CURRENT);
      [...strip.children].forEach(x=>x.classList.toggle("on",x.dataset.id===c));
    } else route(); })
  .catch(err=>{
    app.innerHTML=`<div class="failed"><h3>Could not load the index</h3>
      <p><code>index.json</code> did not load: ${String(err.message||err)}</p>
      <p>This page fetches its data at runtime, so it needs to be served over HTTP rather than opened
      from the filesystem. From the project directory:</p>
      <div class="formula">python3 -m http.server 8080
open http://localhost:8080/</div>
      <p>If the file is missing, rebuild it:</p>
      <div class="formula">python3 ingest/fetch_adv.py --years 2018-2026
python3 ingest/build_index.py</div></div>`;
  });
